<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Constraint_Slope 图标预览</title>
<style>
  body { background:#333; font-family:sans-serif; color:#eee; display:flex; flex-direction:column; align-items:center; gap:24px; padding:40px; }
  .card { background:#fff; border-radius:8px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:10px; box-shadow:0 4px 20px rgba(0,0,0,.4); }
  .card .label { color:#888; font-size:14px; }
  h2 { color:#fff; margin:0; }
  .row { display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
  <h2>Constraint_Slope 图标</h2>
  <div class="row">
    <div class="card">
      <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g>
          <path style="fill:none;stroke:#280000;stroke-width:6;stroke-linecap:round;stroke-linejoin:round" d="M 8,54 46,20"/>
          <path style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 L 36,50 L 48,39 Z"/>
          <path style="fill:none;stroke:#280000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 26,50 26,44"/>
          <path style="fill:none;stroke:#ef2929;stroke-width:2.5;stroke-linecap:round" d="M 40,12 48,5"/>
        </g>
      </svg>
      <div class="label">原始大小 (64×64)</div>
    </div>
    <div class="card">
      <svg width="160" height="160" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g>
          <path style="fill:none;stroke:#280000;stroke-width:6;stroke-linecap:round;stroke-linejoin:round" d="M 8,54 46,20"/>
          <path style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 L 36,50 L 48,39 Z"/>
          <path style="fill:none;stroke:#280000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 26,50 26,44"/>
          <path style="fill:none;stroke:#ef2929;stroke-width:2.5;stroke-linecap:round" d="M 40,12 48,5"/>
        </g>
      </svg>
      <div class="label">放大 2.5x</div>
    </div>
  </div>
  <div class="card">
    <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <g>
        <path style="fill:none;stroke:#280000;stroke-width:6;stroke-linecap:round;stroke-linejoin:round" d="M 8,54 46,20"/>
        <path style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 L 36,50 L 48,39 Z"/>
        <path style="fill:none;stroke:#280000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" d="M 20,50 26,50 26,44"/>
        <path style="fill:none;stroke:#ef2929;stroke-width:2.5;stroke-linecap:round" d="M 40,12 48,5"/>
      </g>
    </svg>
    <div class="label">工具栏小尺寸 (24×24)</div>
  </div>
</body>
</html>
